name: Build

on: [pull_request, push, repository_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARDUINO_LIBS: "\"Adafruit SPIFlash\" \"Adafruit seesaw Library\" \"Adafruit NeoPixel\" \"Adafruit Circuit Playground\" \"Adafruit InternalFlash\" \"SdFat - Adafruit Fork\" \"SD\" \"MIDI Library\" \"Pico PIO USB\""

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

    - name: Checkout adafruit/ci-arduino
      uses: actions/checkout@v4
      with:
         repository: adafruit/ci-arduino
         path: ci

    - name: pre-install
      run: bash ci/actions_install.sh

#    - name: clang
#      run: python3 ci/run-clang-format.py -r src/arduino

    - name: doxygen
      env:
        GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        PRETTYNAME : "Adafruit TinyUSB Library"
      run: bash ci/doxy_gen_and_deploy.sh

  # ---------------------------------------
  # build
  # ---------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        arduino-platform:
           # ESP32 ci use dev json
           - 'feather_esp32_v2'
           - 'feather_esp32s2'
           - 'feather_esp32s3'
           - 'esp32p4'
           # nRF52
           - 'cpb'
           - 'nrf52840'
           # RP2040
           - 'feather_rp2040_tinyusb'
           - 'pico_rp2040_tinyusb_host'
           # SAMD
           - 'metro_m0_tinyusb'
           - 'metro_m4_tinyusb'
           # Ch32v2
           - 'CH32V20x_EVT'
           - 'ch32_community_ch32v20x'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout adafruit/ci-arduino
      uses: actions/checkout@v4
      with:
         repository: adafruit/ci-arduino
         path: ci

    - name: pre-install
      run: bash ci/actions_install.sh

    - name: Install Libraries
      run: |
        arduino-cli lib install ${{ env.ARDUINO_LIBS }}
        arduino-cli lib list

    # the core compiles against its bundled TinyUSB (boards.txt -I), empty in WCH:ch32v 1.0.5: use this checkout
    - name: Use this checkout as the CH32 core's TinyUSB
      if: matrix.arduino-platform == 'CH32V20x_EVT'
      run: |
        arduino-cli core install WCH:ch32v --additional-urls https://github.com/openwch/board_manager_files/raw/main/package_ch32v_index.json
        for lib in ~/.arduino15/packages/WCH/hardware/ch32v/*/libraries/Adafruit_TinyUSB_Arduino; do
          rm -rf "$lib"
          ln -s "$GITHUB_WORKSPACE" "$lib"
        done

    - name: test platforms
      if: matrix.arduino-platform != 'ch32_community_ch32v20x'
      run: python3 ci/build_platform.py ${{ matrix.arduino-platform }}

    - name: test community CH32 TinyUSB
      if: matrix.arduino-platform == 'ch32_community_ch32v20x'
      run: |
        python3 - "${{ matrix.arduino-platform }}" <<'PY'
        import sys
        sys.path.insert(0, 'ci')
        import build_platform
        # ci-arduino defaults this board to USB disabled; keep this override in sync
        # with BOARDS in .claude/skills/build/scripts/check_build.py.
        build_platform.ALL_PLATFORMS['ch32_community_ch32v20x'][0] = 'ch32-community:ch32v:CH32V20x_EVT:usb=tinyusb_usbd'
        build_platform.main()
        sys.exit(build_platform.success)
        PY
