name: Build

on: [pull_request, push, repository_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARDUINO_LIBS: "\"Adafruit SPIFlash\" \"Adafruit seesaw Library\" \"Adafruit NeoPixel\" \"Adafruit Circuit Playground\" \"Adafruit InternalFlash\" \"SdFat - Adafruit Fork\" \"SD\" \"MIDI Library\" \"Pico PIO USB\""

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

    - name: Checkout adafruit/ci-arduino
      uses: actions/checkout@v4
      with:
         repository: adafruit/ci-arduino
         path: ci

    - name: pre-install
      run: bash ci/actions_install.sh

#    - name: clang
#      run: python3 ci/run-clang-format.py -r src/arduino

    - name: doxygen
      env:
        GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        PRETTYNAME : "Adafruit TinyUSB Library"
      run: bash ci/doxy_gen_and_deploy.sh

  # ---------------------------------------
  # build
  # ---------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        arduino-platform:
           # ESP32 ci use dev json
           - 'feather_esp32_v2'
           - 'feather_esp32s2'
           - 'feather_esp32s3'
           - 'esp32p4'
           # nRF52
           - 'cpb'
           - 'nrf52840'
           # RP2040
           - 'feather_rp2040_tinyusb'
           - 'pico_rp2040_tinyusb_host'
           # SAMD
           - 'metro_m0_tinyusb'
           - 'metro_m4_tinyusb'
           # Ch32v2
           - 'CH32V20x_EVT'
           - 'ch32_community_ch32v20x_tinyusb_usbd'
           # Metro CH32V4x7
           - 'metro_ch32v407'
           - 'metro_ch32v467'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout adafruit/ci-arduino
      uses: actions/checkout@v4
      with:
         repository: adafruit/ci-arduino
         path: ci

    - name: pre-install
      run: bash ci/actions_install.sh

    - name: Install Libraries
      run: |
        arduino-cli lib install ${{ env.ARDUINO_LIBS }}
        arduino-cli lib list

    # the core compiles against its bundled TinyUSB (boards.txt -I), empty in WCH:ch32v 1.0.5: use this checkout
    - name: Use this checkout as the CH32 core's TinyUSB
      if: matrix.arduino-platform == 'CH32V20x_EVT'
      run: |
        arduino-cli core install WCH:ch32v --additional-urls https://github.com/openwch/board_manager_files/raw/main/package_ch32v_index.json
        for lib in ~/.arduino15/packages/WCH/hardware/ch32v/*/libraries/Adafruit_TinyUSB_Arduino; do
          rm -rf "$lib"
          ln -s "$GITHUB_WORKSPACE" "$lib"
        done

    # The community core also includes TinyUSB headers directly from its bundled library.
    - name: Use this checkout as the community CH32 core's TinyUSB
      if: matrix.arduino-platform == 'ch32_community_ch32v20x_tinyusb_usbd' || startsWith(matrix.arduino-platform, 'metro_ch32')
      run: |
        arduino-cli core install ch32-community:ch32v --additional-urls https://github.com/ch32-community/board_manager_files/raw/main/package_ch32-commmunity_index.json
        for lib in ~/.arduino15/packages/ch32-community/hardware/ch32v/*/libraries/Adafruit_TinyUSB_Arduino; do
          rm -rf "$lib"
          ln -s "$GITHUB_WORKSPACE" "$lib"
        done

    - name: test platforms
      run: python3 ci/build_platform.py ${{ matrix.arduino-platform }}

    # build_platform.py reinstalls the core unpinned: a release since the step above would replace the symlinked one
    - name: Check the CH32 core built this checkout's TinyUSB
      if: >-
        ${{ !cancelled() && (matrix.arduino-platform == 'CH32V20x_EVT' ||
        matrix.arduino-platform == 'ch32_community_ch32v20x_tinyusb_usbd' || startsWith(matrix.arduino-platform, 'metro_ch32')) }}
      env:
        CH32_PACKAGE: ${{ matrix.arduino-platform == 'CH32V20x_EVT' && 'WCH' || 'ch32-community' }}
      run: |
        found=0
        for lib in "$HOME/.arduino15/packages/$CH32_PACKAGE/hardware/ch32v/"*/libraries/Adafruit_TinyUSB_Arduino; do
          [ -e "$lib" ] || continue
          found=1
          [ "$(readlink "$lib")" = "$GITHUB_WORKSPACE" ] || { echo "::error::$lib is not this checkout"; exit 1; }
        done
        [ "$found" -eq 1 ] || { echo "::error::No bundled TinyUSB found for $CH32_PACKAGE"; exit 1; }
