repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v15.0.7
  hooks:
  - id: clang-format
    exclude: |
      (?x)^(
        examples/|
        src/class|
        src/common|
        src/device|
        src/host|
        src/osal|
        src/portable|
        src/tusb_option.h|
        src/tusb.c|
        src/tusb.h
      )
    types_or: [c++, c, header]

- repo: https://github.com/codespell-project/codespell
  rev: v2.2.4
  hooks:
  - id: codespell
    args: [-w]

- repo: local
  hooks:
  - id: agent-contract-tests
    name: agent contract tests
    # the installed agentrc on a dev PC; in CI the pinned one, fetched first
    entry: python3 .claude/skills/hil-contract/scripts/agentrc_pin.py test
    language: python
    additional_dependencies: [pyserial==3.5]
    pass_filenames: false
    # plus the CI workflow and legacy build table test_build.py checks
    files: ^(\.claude/|test/hil/|\.github/workflows/githubci\.yml$|tools/build_all\.py$)
